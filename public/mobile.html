<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>소오강호 / 동방불패 (1993) — 모바일 실전 플레이</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/mobile.css" />
</head>
<body data-mode="mobile-play" class="mobile-play-body">
  <header class="mobile-topbar">
    <div class="mobile-brand">
      <span class="mobile-title">⚔️ 소오강호 (1993)</span>
      <span id="statusPill" class="pill mobile-status-pill">로딩 중...</span>
    </div>
    <div class="mobile-top-actions">
      <button id="globalModeToggle" class="btn small primary" data-mode="remastered" title="원본 / 리마스터 전환">✨ HD</button>
      <button id="pwaInstallBtn" class="btn small hidden" title="홈 화면에 앱 설치">📲 앱 설치</button>
      <button id="pwaOfflineBtn" class="btn small" title="오프라인 플레이용 에셋 저장">📥 오프라인</button>
      <button class="btn small mobile-drawer-btn" data-drawer="drawerMap">🗺 상태·맵</button>
      <button class="btn small mobile-drawer-btn" data-drawer="drawerObjs">👥 인물·일지</button>
      <button class="btn small mobile-drawer-btn" data-drawer="drawerMenu">⚙ 메뉴·저장</button>
    </div>
  </header>

  <main id="tab-play" class="panel active mobile-play-main">
    <section class="mobile-stage">
      <div class="mobile-canvas-wrap">
        <canvas id="gameCanvas" width="768" height="480" class="game-canvas mobile-canvas"></canvas>
        <button id="gameSkipIntroBtn" class="btn small skip-intro-btn hidden">⏭ 오프닝 건너뛰기 (ESC)</button>

        <div class="mobile-hud-badges">
          <span id="gameCoordBadge" class="badge">X:0 Y:0</span>
          <span id="gameRenderBadge" class="badge">HD 리마스터</span>
          <span id="gameSwordBadge" class="badge">검기 Lv.1</span>
        </div>

        <!-- Left-Bottom Touch D-Pad -->
        <div class="mobile-dpad-overlay" aria-label="터치 이동 패드">
          <button class="btn small game-move-btn" data-dx="-1" data-dy="-1" aria-label="북서">↖</button>
          <button class="btn small game-move-btn" data-dx="0" data-dy="-1" aria-label="북">▲</button>
          <button class="btn small game-move-btn" data-dx="1" data-dy="-1" aria-label="북동">↗</button>
          <button class="btn small game-move-btn" data-dx="-1" data-dy="0" aria-label="서">◀</button>
          <div class="mobile-dpad-center">이동</div>
          <button class="btn small game-move-btn" data-dx="1" data-dy="0" aria-label="동">▶</button>
          <button class="btn small game-move-btn" data-dx="-1" data-dy="1" aria-label="남서">↙</button>
          <button class="btn small game-move-btn" data-dx="0" data-dy="1" aria-label="남">▼</button>
          <button class="btn small game-move-btn" data-dx="1" data-dy="1" aria-label="남동">↘</button>
        </div>

        <!-- Right-Bottom Touch Action Buttons -->
        <div class="mobile-action-overlay" aria-label="전투 및 상호작용">
          <button id="gameInteractBtn" class="mobile-act-btn talk">💬<span>대화</span></button>
          <button id="gameAttackBtn" class="mobile-act-btn attack">⚔️<span>공격</span></button>
        </div>

        <!-- Dialogue Box Overlay -->
        <div id="gameDialogueBox" class="game-dialogue-box mobile-dlg-overlay hidden">
          <img id="gameDlgPortrait" class="game-dlg-portrait" alt="인물" />
          <div class="game-dlg-body">
            <div class="game-dlg-head">
              <strong id="gameDlgSpeaker">인물</strong>
              <span id="gameDlgStepInfo" class="muted">1 / 1</span>
            </div>
            <div id="gameDlgText" class="game-dlg-text"></div>
            <canvas id="gameDlgKfont" width="560" height="104" class="kfont-canvas hidden"></canvas>
            <div class="game-dlg-actions">
              <button id="gameDlgNextBtn" class="btn small primary">다음 ▶</button>
              <button id="gameDlgCloseBtn" class="btn small">닫기</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Bottom Martial Arts Skill Quickbar -->
      <div class="mobile-bottom-bar">
        <div id="gameSkillBar" class="skill-bar mobile-skill-bar"></div>
      </div>
    </section>

    <!-- Drawer 1: Minimap + Hero Status + Inventory -->
    <aside id="drawerMap" class="mobile-drawer hidden" aria-label="상태 및 미니맵">
      <div class="mobile-drawer-head">
        <strong>🗺 미니맵 · 영호충 상태 · 소지품</strong>
        <button class="btn small mobile-drawer-close" data-drawer="drawerMap">✕</button>
      </div>
      <div class="mobile-drawer-body">
        <div class="card">
          <h3>실시간 미니맵</h3>
          <div class="minimap-wrap">
            <canvas id="gameMinimapCanvas" width="160" height="160" class="minimap-canvas"></canvas>
            <div id="gameMinimapCoords" class="muted">X:0 Y:0</div>
          </div>
        </div>
        <div class="card">
          <h3>영호충 상태</h3>
          <div id="gameStatusBox" class="game-status-box"></div>
        </div>
        <div class="card">
          <h3>소지품 &amp; 비급</h3>
          <div id="gameInventoryList" class="game-inv-list"></div>
        </div>
      </div>
    </aside>

    <!-- Drawer 2: Chapter Objects & Event Log -->
    <aside id="drawerObjs" class="mobile-drawer hidden" aria-label="인물 및 일지">
      <div class="mobile-drawer-head">
        <strong>👥 등장인물 / 🎁 보물 / 📜 일지</strong>
        <button class="btn small mobile-drawer-close" data-drawer="drawerObjs">✕</button>
      </div>
      <div class="mobile-drawer-body">
        <div class="card">
          <div class="row-between">
            <h3>챕터 오브젝트</h3>
            <span id="gameObjCountBadge" class="badge">0</span>
          </div>
          <div id="gameObjList" class="game-obj-list"></div>
        </div>
        <div class="card">
          <h3>모험 일지</h3>
          <div id="gameLogList" class="game-log-list"></div>
        </div>
      </div>
    </aside>

    <!-- Drawer 3: Chapter / Event / Save / Ending / Settings -->
    <aside id="drawerMenu" class="mobile-drawer hidden" aria-label="게임 메뉴 및 저장">
      <div class="mobile-drawer-head">
        <strong>⚙ 챕터 · 이벤트 · 저장 · 엔딩</strong>
        <button class="btn small mobile-drawer-close" data-drawer="drawerMenu">✕</button>
      </div>
      <div class="mobile-drawer-body">
        <div class="card">
          <h3>챕터 &amp; 이벤트</h3>
          <label class="mobile-field">
            <span>챕터 선택</span>
            <select id="gameChapterSelect"></select>
          </label>
          <label class="mobile-field">
            <span>스토리 이벤트</span>
            <select id="gameEventSelect"></select>
          </label>
          <div class="mobile-btn-grid">
            <button id="gameRunEventBtn" class="btn small primary">▶ 이벤트 실행</button>
            <button id="gameIntroBtn" class="btn small">🎬 오프닝 재생</button>
          </div>
        </div>

        <div class="card">
          <h3>전투 &amp; 오디오 설정</h3>
          <div class="mobile-btn-grid">
            <button id="gameBgmToggle" class="btn small">🎵 BGM: OFF</button>
            <button id="gameAiToggle" class="btn small primary">🤖 적 AI: ON</button>
            <button id="gameNoClipToggle" class="btn small">🧱 충돌: ON</button>
          </div>
        </div>

        <div class="card">
          <h3>저장 / 불러오기 (SV0~SV2 · QUICK)</h3>
          <label class="mobile-field">
            <span>슬롯</span>
            <select id="gameSaveSlotSelect">
              <option value="0">SV0 (슬롯 1)</option>
              <option value="1">SV1 (슬롯 2)</option>
              <option value="2">SV2 (슬롯 3)</option>
              <option value="quick">QUICK (자동)</option>
            </select>
          </label>
          <div class="mobile-btn-grid">
            <button id="gameSaveBtn" class="btn small">💾 저장</button>
            <button id="gameLoadBtn" class="btn small">📂 불러오기</button>
          </div>
        </div>

        <div class="card">
          <h3>멀티 엔딩 (EM1~3 / D9)</h3>
          <label class="mobile-field">
            <span>엔딩 선택</span>
            <select id="gameEndingSelect">
              <option value="em1">EM1: 정파 맹주 엔딩</option>
              <option value="em2">EM2: 은거 소오강호 엔딩</option>
              <option value="em3">EM3: 마교 혈전 엔딩</option>
              <option value="d9">D9: 동방불패 비극 엔딩</option>
            </select>
          </label>
          <button id="gameEndingBtn" class="btn small primary" style="width:100%">🏆 엔딩 감상</button>
        </div>
      </div>
    </aside>
  </main>

  <script>
    (function () {
      function toggleDrawer(id, forceClose) {
        var drawers = document.querySelectorAll('.mobile-drawer');
        drawers.forEach(function (el) {
          if (el.id === id && !forceClose) {
            el.classList.toggle('hidden');
          } else {
            el.classList.add('hidden');
          }
        });
      }
      document.querySelectorAll('.mobile-drawer-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          toggleDrawer(btn.getAttribute('data-drawer'), false);
        });
      });
      document.querySelectorAll('.mobile-drawer-close').forEach(function (btn) {
        btn.addEventListener('click', function () {
          toggleDrawer(btn.getAttribute('data-drawer'), true);
        });
      });
    })();
  </script>
  <script src="/app.js"></script>
</body>
</html>
